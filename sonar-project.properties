sonar.projectKey=canvatheque
sonar.projectName=Canvathèque
sonar.sourceEncoding=UTF-8

sonar.sources=app,components,features,lib,i18n,prisma/seed.ts,proxy.ts,instrumentation.ts,scripts
sonar.tests=app,components,features,lib,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**/*
sonar.exclusions=**/*.test.ts,**/*.test.tsx,lib/generated/**,components/ui/button.tsx,docs/**,**/*.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mêmes exclusions de couverture que vitest.config.mts
sonar.coverage.exclusions=app/fonts.ts,app/global-error.tsx,scripts/**,**/*.config.*,tests/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
