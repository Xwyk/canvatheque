  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="#C81E4B"/><stop offset="1" stop-color="#5B3FA6"/></linearGradient>
    <path id="petale" d="M0 0 C10 -20 30 -20 40 0 C30 20 10 20 0 0 Z"/>
    <clipPath id="c"><rect width="120" height="80"/></clipPath>
