# Pile de tests de bout en bout : image de production + Mailpit.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
# Les limites de débit sont relevées : les scénarios créent de nombreux comptes depuis la même IP
# (les limites elles-mêmes sont couvertes par les tests d'intégration).
# PostgreSQL est publié sur la boucle locale pour le seed (30 modèles de démonstration) :
#   npm run db:seed
services:
  app:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      RATE_LIMIT_SIGNUP_PER_HOUR: "1000"
      RATE_LIMIT_LOGIN_PER_15MIN: "1000"
      RATE_LIMIT_RESET_PER_HOUR: "1000"
      RATE_LIMIT_REPORT_PER_DAY: "1000"
      # Paire clé/IV de TEST (ADR-013), propre aux E2E : tests/e2e/support/cwprj.ts. La paire
      # éventuelle du .env suit (plusieurs paires possibles) : les vrais projets restent lisibles.
      CWPRJ_KEY: ${E2E_CWPRJ_KEY:-16987a1d102397ba490f00e428dd20d4b8293fb00f56a331bed9bf4ee96ed178}${CWPRJ_KEY:+,${CWPRJ_KEY}}
      CWPRJ_IV: ${E2E_CWPRJ_IV:-4f8b82caff43a6382fda2e877174e6b3}${CWPRJ_IV:+,${CWPRJ_IV}}
    depends_on:
      mailpit:
        condition: service_healthy

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  mailpit:
    profiles: !reset []
