<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Atelier Découpe — Galerie des modèles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#221F3A}a:hover{color:#C81E4B}
</style>
</helmet>
<div style="min-height: 1700px; background: #FFFFFF; color: #221F3A; font-family: 'Figtree', system-ui, sans-serif; font-size: 17px; line-height: 1.5">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; box-sizing: border-box">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px; padding: 20px 0">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #221F3A; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 22px; min-height: 44px">
<svg viewBox="0 0 100 100" aria-hidden="true" style="width: 36px; height: 36px"><circle cx="50" cy="50" r="46" fill="#C81E4B"/><path d="M50 18 L59 40 L82 40 L63 54 L70 77 L50 63 L30 77 L37 54 L18 40 L41 40 Z" fill="#FFFFFF"/></svg>
Atelier Découpe
</a>
<nav aria-label="Navigation principale" style="display: flex; flex-wrap: wrap; gap: 4px 20px; font-weight: 600">
<a href="Galerie.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: underline; text-decoration-color: #C81E4B; text-decoration-thickness: 3px; text-underline-offset: 8px">Modèles</a>
<a href="Galerie.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">Catégories</a>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none">Aide</a>
</nav>
<div style="flex: 1 1 0; min-width: 0"></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="Connexion.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #221F3A; font-weight: 700; text-decoration: none; color: #221F3A">Se connecter</a>
<a href="Connexion.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: #C81E4B; font-weight: 700; text-decoration: none; color: #FFFFFF; border: 2px solid #C81E4B">Créer un compte</a>
</div>
</header>

<section style="display: flex; flex-direction: column; gap: 20px; padding: 24px 0 32px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(34px, 4.5vw, 48px); line-height: 1.08; letter-spacing: -0.02em">Tous les modèles</h1>
<form action="#" style="display: flex; flex-wrap: wrap; gap: 12px; max-width: 720px">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher un modèle</label>
<input id="q" type="search" value="papillon" style="flex: 1 1 260px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 22px; border-radius: 999px; border: 2px solid #221F3A; font-family: 'Figtree', system-ui, sans-serif; font-size: 17px; color: #221F3A; background: #FFFFFF">
<button type="submit" style="height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: #C81E4B; color: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">Rechercher</button>
</form>
</section>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px 40px">

<aside aria-label="Filtres" style="flex: 0 0 240px; max-width: 100%; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="padding: 0 0 8px; font-weight: 800; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5873">Format</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #C81E4B">CWPRJ (CanvasWorkspace)</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #C81E4B">SVG</label>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="padding: 0 0 8px; font-weight: 800; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5873">Catégorie</legend>
<sc-for list="{{cats}}" as="cat" hint-placeholder-count="6">
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer"><input type="checkbox" checked="{{cat.on}}" style="width: 22px; height: 22px; margin: 0; accent-color: #C81E4B">{{cat.name}}</label>
</sc-for>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="padding: 0 0 8px; font-weight: 800; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: #5B5873">Licence</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #C81E4B">Libre, même commercial</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #C81E4B">Usage personnel uniquement</label>
</fieldset>
<a href="Galerie.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700">Réinitialiser les filtres</a>
</aside>

<section aria-label="Résultats" style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px">
<span style="font-weight: 700">6 modèles</span>
<button type="button" aria-label="Retirer le filtre SVG" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 16px; border-radius: 999px; border: 0; background: #F1EEF9; color: #221F3A; font-family: 'Figtree', system-ui, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">SVG<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px" fill="none" stroke="#221F3A" stroke-width="2.4" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></button>
<button type="button" aria-label="Retirer le filtre Nature et animaux" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 16px; border-radius: 999px; border: 0; background: #F1EEF9; color: #221F3A; font-family: 'Figtree', system-ui, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">Nature et animaux<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px" fill="none" stroke="#221F3A" stroke-width="2.4" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></button>
</div>
<label style="display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px">Trier par
<select style="height: 44px; padding: 0 36px 0 16px; border-radius: 12px; border: 2px solid #221F3A; background: #FFFFFF; color: #221F3A; font-family: 'Figtree', system-ui, sans-serif; font-weight: 600; font-size: 16px">
<option>Plus récents</option>
<option>Populaires cette semaine</option>
<option>Plus téléchargés</option>
</select>
</label>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 32px 24px">
<sc-for list="{{models}}" as="item" hint-placeholder-count="6">
<article style="display: flex; flex-direction: column; gap: 12px; min-width: 0">
<div style="position: relative; aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; background: {{item.bg}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 100 100" aria-hidden="true" style="width: 58%; height: 58%"><path d="{{item.d}}" fill="{{item.fg}}"/></svg>
<span style="position: absolute; top: 14px; left: 14px; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; letter-spacing: 0.04em; background: {{item.badgeBg}}; color: {{item.badgeFg}}">{{item.fmt}}</span>
<button type="button" aria-label="Ajouter {{item.title}} aux favoris" style="position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(34,31,58,0.16)">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px" fill="none" stroke="#221F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5 C4 14.5 3 9 6.5 6.5 C9 4.8 11.5 6 12 8 C12.5 6 15 4.8 17.5 6.5 C21 9 20 14.5 12 20.5 Z"/></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<a href="Fiche.dc.html" style="font-weight: 700; font-size: 18px; line-height: 1.25; text-decoration: none">{{item.title}}</a>
<div style="display: flex; align-items: center; gap: 8px; color: #5B5873; font-size: 14px">
<span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; background: {{item.avatarBg}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">{{item.initial}}</span>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{item.author}}</span>
<span style="margin-left: auto; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px" fill="none" stroke="#5B5873" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 V15 M7 11 L12 16 L17 11 M5 20 H19"/></svg>
{{item.count}}
</span>
</div>
</div>
</article>
</sc-for>
</div>

<div role="status" aria-label="Chargement des modèles suivants" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px">
<sc-for list="{{skeletons}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="aspect-ratio: 1 / 1; border-radius: 20px; background: #F1EEF9"></div>
<div style="height: 18px; width: 70%; border-radius: 6px; background: #F1EEF9"></div>
<div style="height: 14px; width: 45%; border-radius: 6px; background: #F1EEF9"></div>
</div>
</sc-for>
</div>
</section>
</div>
</div>

<footer style="margin-top: 72px; border-top: 1px solid #E4E0F0">
<div style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px; color: #5B5873; font-size: 15px">
<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #221F3A">Atelier Découpe</span>
<nav aria-label="Pied de page" style="display: flex; flex-wrap: wrap; gap: 4px 20px">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; color: #5B5873">À propos</a>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; color: #5B5873">Aide</a>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; color: #5B5873">Mentions légales</a>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; color: #5B5873">Confidentialité</a>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; color: #5B5873">CGU</a>
</nav>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const shapes = {
      star: 'M50 8 L61 38 L93 38 L67 57 L77 88 L50 69 L23 88 L33 57 L7 38 L39 38 Z',
      heart: 'M50 88 C10 58 6 30 28 20 C40 15 50 24 50 32 C50 24 60 15 72 20 C94 30 90 58 50 88 Z',
      leaf: 'M15 85 C10 40 40 12 88 12 C90 60 60 90 15 85 Z',
      butterfly: 'M50 30 C30 5 6 15 10 40 C12 55 30 55 42 52 C28 60 24 80 40 88 C48 90 50 78 50 70 C50 78 52 90 60 88 C76 80 72 60 58 52 C70 55 88 55 90 40 C94 15 70 5 50 30 Z',
      cloud: 'M25 78 C8 78 6 52 24 50 C22 28 52 20 60 40 C80 30 96 56 80 74 C78 78 72 78 70 78 Z',
      fish: 'M10 50 C30 20 62 20 80 50 C62 80 30 80 10 50 Z M80 50 L96 32 L96 68 Z'
    };
    const raw = [
      ['Papillon aux ailes ajourées','mamie-ciseaux','SVG','874','butterfly','#D9F0EF','#0F7C7E','#5B3FA6'],
      ['Papillon de nuit','claire_cuts','SVG','302','butterfly','#E5DEF7','#5B3FA6','#0F7C7E'],
      ['Feuille d\u2019automne','papier_et_cie','SVG','236','leaf','#E3F1DD','#3E8E41','#0F7C7E'],
      ['Poisson d\u2019avril','claire_cuts','SVG','129','fish','#FFE6D2','#E8742C','#0F7C7E'],
      ['Nuage de naissance','les-petits-plis','SVG','347','cloud','#DCEBFB','#3B7DD8','#A3183F'],
      ['Petit cœur','atelier-noa','SVG','1 208','heart','#FDE3E8','#C81E4B','#A3183F']
    ];
    const cats = [['Cartes et papeterie',false],['Décoration',false],['Fêtes et événements',false],['Enfants',false],['Nature et animaux',true],['Lettrages et typographie',false]];
    return {
      cats: cats.map(c => ({ name: c[0], on: c[1] })),
      skeletons: [1,2,3],
      models: raw.map(r => ({
        title: r[0], author: r[1], initial: r[1].charAt(0).toUpperCase(), fmt: r[2], count: r[3],
        d: shapes[r[4]], bg: r[5], fg: r[6], avatarBg: r[7],
        badgeBg: r[2] === 'SVG' ? '#F5B82E' : '#221F3A',
        badgeFg: r[2] === 'SVG' ? '#221F3A' : '#FFFFFF'
      }))
    };
  }
}
</script>
</body>
</html>
