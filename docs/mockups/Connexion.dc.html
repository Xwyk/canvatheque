<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Atelier Découpe — Créer un compte pour télécharger</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C81E4B}a:hover{color:#A3183F}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #FFFFFF; color: #221F3A; font-family: 'Figtree', system-ui, sans-serif; font-size: 17px; line-height: 1.5">

<div aria-hidden="true" style="position: absolute; inset: 0; box-sizing: border-box; padding: 20px 120px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; align-items: center; gap: 24px; height: 44px">
<div style="width: 190px; height: 28px; border-radius: 8px; background: #E4E0F0"></div>
<div style="width: 280px; height: 16px; border-radius: 8px; background: #F1EEF9"></div>
<div style="flex: 1 1 0"></div>
<div style="width: 140px; height: 44px; border-radius: 999px; background: #F1EEF9"></div>
</div>
<div style="display: flex; gap: 40px">
<div style="flex: 1 1 0; height: 560px; border-radius: 28px; background: #F1EEF9"></div>
<div style="flex: 0 0 400px; display: flex; flex-direction: column; gap: 18px">
<div style="width: 80px; height: 24px; border-radius: 999px; background: #E4E0F0"></div>
<div style="width: 300px; height: 44px; border-radius: 10px; background: #E4E0F0"></div>
<div style="height: 60px; border-radius: 18px; background: #F4B8C6"></div>
<div style="height: 52px; border-radius: 18px; background: #F1EEF9"></div>
<div style="height: 220px; border-radius: 24px; background: #F1EEF9"></div>
</div>
</div>
</div>

<div style="position: absolute; inset: 0; background: rgba(34,31,58,0.62)"></div>

<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
<section role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="position: relative; width: 500px; box-sizing: border-box; padding: 40px 40px 32px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 24px 64px rgba(34,31,58,0.35); display: flex; flex-direction: column; gap: 24px">

<button type="button" aria-label="Fermer" style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px" fill="none" stroke="#221F3A" stroke-width="2.4" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
</button>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 id="dlg-title" style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em; padding-right: 36px">Créez un compte gratuit pour télécharger</h1>
<p style="margin: 0; color: #5B5873; font-size: 16px">Une minute, aucun paiement. Votre téléchargement démarre dès l'inscription.</p>
</div>

<div role="tablist" aria-label="Connexion ou inscription" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #F1EEF9">
<button type="button" role="tab" aria-selected="false" style="flex: 1 1 0; min-height: 44px; border-radius: 999px; border: 0; background: transparent; color: #3D3A57; font-family: 'Figtree', system-ui, sans-serif; font-weight: 700; font-size: 16px; cursor: pointer">Connexion</button>
<button type="button" role="tab" aria-selected="true" style="flex: 1 1 0; min-height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; color: #221F3A; font-family: 'Figtree', system-ui, sans-serif; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 1px 4px rgba(34,31,58,0.18)">Inscription</button>
</div>

<form action="#" style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pseudo" style="font-weight: 700; font-size: 15px">Pseudo</label>
<input id="pseudo" type="text" autocomplete="username" value="lucie.m" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid #BDB8D6; font-family: 'Figtree', system-ui, sans-serif; font-size: 17px; color: #221F3A; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-weight: 700; font-size: 15px">Adresse e-mail</label>
<input id="email" type="email" autocomplete="email" placeholder="vous@exemple.fr" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid #BDB8D6; font-family: 'Figtree', system-ui, sans-serif; font-size: 17px; color: #221F3A; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pwd" style="font-weight: 700; font-size: 15px">Mot de passe</label>
<input id="pwd" type="password" autocomplete="new-password" value="papillon-de-nuit" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid #221F3A; font-family: 'Figtree', system-ui, sans-serif; font-size: 17px; color: #221F3A; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #3D3A57">
<span aria-hidden="true" style="display: flex; gap: 4px; flex: 0 0 120px"><span style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #0F7C7E"></span><span style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #0F7C7E"></span><span style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #E4E0F0"></span></span>
<span>Robustesse : bonne · 10 caractères minimum</span>
</div>
</div>
<label style="display: flex; align-items: flex-start; gap: 12px; font-size: 15px; color: #3D3A57; cursor: pointer">
<input type="checkbox" checked style="flex: 0 0 22px; width: 22px; height: 22px; margin: 1px 0 0; accent-color: #C81E4B">
<span>J'accepte les <a href="Main.dc.html">conditions d'utilisation</a> et la <a href="Main.dc.html">politique de confidentialité</a>.</span>
</label>
<button type="submit" style="min-height: 56px; border-radius: 16px; border: 0; background: #C81E4B; color: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; font-weight: 800; font-size: 18px; cursor: pointer">Créer mon compte et télécharger</button>
</form>

<p style="margin: 0; text-align: center; font-size: 15px; color: #5B5873">Déjà inscrit·e ? <a href="Connexion.dc.html" style="font-weight: 700">Se connecter</a></p>
</section>
</div>
</div>
</x-dc>

}
</script>
</body>
</html>
