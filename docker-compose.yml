# Pile Canvathèque. Production : `docker compose up -d` (voir README).
# Développement : docker-compose.override.yml est chargé automatiquement.
# Profils : `dev` (Mailpit), `quality` (SonarQube).

name: canvatheque

x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
  S3_BUCKET_MODELS: ${S3_BUCKET_MODELS:-models}
  S3_BUCKET_PREVIEWS: ${S3_BUCKET_PREVIEWS:-previews}

services:
  app:
    build:
      context: .
      target: runner
    image: canvatheque-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *s3-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-canvatheque}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/${POSTGRES_DB:-canvatheque}
    ports:
      # Publié sur la boucle locale seulement : en production, Caddy est le seul point d'entrée
      # (X-Forwarded-For fiable pour les limites par IP). APP_BIND=0.0.0.0 pour l'exposer.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canvatheque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-canvatheque}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost:3000}
      # Alias utilisé par le healthcheck (`mc ready local`)
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@localhost:9000
    volumes:
      - miniodata:/data
    ports:
      - "${APP_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    environment:
      <<: *s3-env
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    volumes:
      - ./docker/minio-init.sh:/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    profiles: ["quality"]
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9002:9000"
    volumes:
      - sonardata:/opt/sonarqube/data
      - sonarextensions:/opt/sonarqube/extensions
    depends_on:
      sonar-db:
        condition: service_healthy
    healthcheck:
      # L'image SonarQube fournit curl (pas wget).
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/api/system/status | grep -q UP"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2g

  sonar-db:
    image: postgres:16-alpine
    profiles: ["quality"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonardb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
  sonardata:
  sonarextensions:
  sonardb:
